<circle cx="480" cy="740" r="95" fill="#5aa845"/><circle cx="450" cy="710" r="60" fill="#78c25c"/><circle cx="520" cy="770" r="50" fill="#4d9a3b"/>
<path d="M640 700 q-40 0 -40 60 q0 70 50 70 q20 0 25 -10 q5 10 25 10 q50 0 50 -70 q0 -60 -40 -60 q-15 0 -35 10 q-20 -10 -35 -10z" fill="#e3261d"/><path d="M675 700 v-30" stroke="#2f7d32" stroke-width="10"/>
<ellipse cx="800" cy="800" rx="45" ry="35" fill="#f7e049"/>
</g>
<rect width="900" height="900" filter="url(#grain)"/>
</svg>
