<rect x="70" y="440" width="230" height="140" rx="16" fill="#ffffff" opacity=".7" stroke="#9fb3c0" stroke-width="5"/><rect x="90" y="470" width="190" height="95" rx="10" fill="#e5a24a"/>
<circle cx="380" cy="545" r="38" fill="#e2352a"/><circle cx="450" cy="550" r="34" fill="#d62c22"/><circle cx="415" cy="500" r="32" fill="#ea3d30"/><path d="M405 470 l10 -10 l10 10" stroke="#2f7d32" stroke-width="7" fill="none"/>
<rect x="520" y="520" width="140" height="60" rx="6" fill="#fff3b0"/><rect x="520" y="520" width="140" height="18" fill="#f2d563"/>
<rect x="700" y="430" width="110" height="150" rx="18" fill="#a8341e" opacity=".9"/><rect x="705" y="410" width="100" height="30" rx="6" fill="#444"/><rect x="715" y="480" width="80" height="50" fill="#f3e3c3"/>
<!-- bottom crisper: carrots, lettuce, capsicum, lemon -->
<rect x="40" y="620" width="820" height="240" rx="20" fill="#e2f1e7" opacity=".6" stroke="#9fb3c0" stroke-width="5"/>
<g transform="rotate(-20 200 760)"><path d="M120 740 L320 755 L320 775 L120 790z" fill="#f08a1c"/><path d="M110 760 l-40 -30 M110 765 l-45 0 M110 770 l-40 30" stroke="#3d9b35" stroke-width="10"/></g>
